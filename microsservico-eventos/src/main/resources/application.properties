spring.application.name=microsservico-eventos

# Configuração do PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eventhub_eventos}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Rejeitar propriedades desconhecidas no JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# Configurações de monitoramento
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Identificação da aplicação
management.info.env.enabled=true
info.app.name=EventHub - Microsserviço de Eventos
info.app.description=API de gerenciamento de eventos
info.app.version=1.0.0

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}