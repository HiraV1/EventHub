services:
  db_eventos:
    image: postgres:17-alpine
    container_name: eventhub-db-eventos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVENTOS_DB_NAME}
      POSTGRES_USER: ${EVENTOS_DB_USER}
      POSTGRES_PASSWORD: ${EVENTOS_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_eventos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENTOS_DB_USER} -d ${EVENTOS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_inscricoes:
    image: postgres:17-alpine
    container_name: eventhub-db-inscricoes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INSCRICOES_DB_NAME}
      POSTGRES_USER: ${INSCRICOES_DB_USER}
      POSTGRES_PASSWORD: ${INSCRICOES_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_inscricoes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INSCRICOES_DB_USER} -d ${INSCRICOES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eventos:
    build:
      context: ./microsservico-eventos
    container_name: eventhub-eventos
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db_eventos:5432/${EVENTOS_DB_NAME}
      DB_USERNAME: ${EVENTOS_DB_USER}
      DB_PASSWORD: ${EVENTOS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db_eventos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inscricoes:
    build:
      context: ./microsservico-inscricoes
    container_name: eventhub-inscricoes
    restart: unless-stopped
    environment:
      DB_HOST: db_inscricoes
      DB_PORT: 5432
      INSCRICOES_DB_NAME: ${INSCRICOES_DB_NAME}
      INSCRICOES_DB_USER: ${INSCRICOES_DB_USER}
      INSCRICOES_DB_PASSWORD: ${INSCRICOES_DB_PASSWORD}
      EVENTOS_API_URL: http://eventos:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db_inscricoes:
        condition: service_healthy
      eventos:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: eventhub-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - eventos
      - inscricoes

  prometheus:
    image: prom/prometheus:latest
    container_name: eventhub-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - eventos
      - inscricoes

  grafana:
    image: grafana/grafana:latest
    container_name: eventhub-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  rabbitmq:
    image: rabbitmq:4-management
    container_name: eventhub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_eventos_data:
  postgres_inscricoes_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data: